#readuo-modern-complete .rd-muted{color:var(--rd-muted)}
#readuo-modern-complete .rd-caption{max-width:390px;margin:14px auto;display:flex;gap:10px;justify-content:space-between;color:var(--muted-foreground);font-size:11px;line-height:1.5}
#readuo-modern-complete #rd-toast{position:absolute;left:18px;right:18px;bottom:85px;padding:14px 16px;background:#172237;color:white;font-size:13px;line-height:1.5;border-radius:12px;box-shadow:0 6px 18px #0002;z-index:9}
#readuo-modern-complete svg{width:18px;height:18px;vertical-align:middle;flex-shrink:0}
#readuo-modern-complete .rd-policy h3{margin:24px 0 8px}
#readuo-modern-complete .rd-policy p{color:var(--rd-muted)}
@media(max-width:420px){#readuo-modern-complete .rd-browser{grid-template-columns:1fr}#readuo-modern-complete .rd-review{align-items:flex-start}#readuo-modern-complete .rd-phone{border-radius:24px}#readuo-modern-complete .rd-content{padding:16px}#readuo-modern-complete .rd-head{padding:14px 16px}#readuo-modern-complete .rd-shelf{padding:12px;gap:9px}#readuo-modern-complete .rd-catalog-items{grid-template-columns:1fr}#readuo-modern-complete .rd-nav button{min-width:43px}#readuo-modern-complete .rd-cover{width:68px;min-width:68px}#readuo-modern-complete .rd-cover.large{width:106px;min-width:106px}#readuo-modern-complete .rd-head h1{font-size:25px}}
</style>
<script>
(()=>{
const root=document.getElementById('readuo-modern-complete');
const view=root.querySelector('#rd-view');
const state={page:'login',history:[],shelf:'Living room',visibility:'Friends',auto:true,status:'Want to read',owned:true,rating:0,liked:false,filter:'All',sort:'recent',view:'shelves',reportReason:'Harassment or bullying',reportContext:'post',name:'Maya Okonkwo',draft:'',photo:false,attachedBook:null,ownPost:null,ownComment:'The atmosphere sounds wonderful.',comments:[],newShelf:'',onboarding:false,friendQuery:'',selectedFriend:'sarah',selectedRequest:'priya',requestCandidate:'riley',incomingRequestIds:['priya','oliver'],sentRequestIds:['eva'],acceptedExtraIds:[],removedIds:[],blockedIds:[],reviewDraft:'',reviewPublished:false,manualTitle:'',manualAuthor:'',manualIsbn:'',manualPublisher:'',manualYear:'',manualDescription:'',manualPhoto:false,manualPossibleIndex:null,lookupIsbn:null,authProvider:'Google',notifications:{requests:true,acceptances:true,likes:true,comments:true}};
const design={accent:'#365bdb',radius:16};
const books=[['Piranesi','Susanna Clarke','#184b61','9780571225392'],['Dune','Frank Herbert','#ab5834','9780441172719'],['The Midnight Library','Matt Haig','#33385e','9780525559474'],['Small Things Like These','Claire Keegan','#1f6558','9780802158741'],['Exhalation','Ted Chiang','#634289','9781101947883'],['The Overstory','Richard Powers','#426653','9780393356687'],['Sea of Tranquility','Emily St. John Mandel','#315d78','9780593321447'],['Braiding Sweetgrass','Robin Wall Kimmerer','#52643c','9781571313560'],['Piranesi','Susanna Clarke','#315d78','9781635575644'],['Piranesi','Susanna Clarke','#52643c','9781526622433']];
const libraryEntries=[
 {entryId:'entry-1',book:0,normalizedIsbn:'9780571225392',shelf:'Living room',status:'Want to read',owned:true},
 {entryId:'entry-2',book:1,normalizedIsbn:'9780441172719',shelf:'Living room',status:'Reading',owned:true},
 {entryId:'entry-3',book:2,normalizedIsbn:'9780525559474',shelf:'Weekend reads',status:'Want to read',owned:false},
 {entryId:'entry-4',book:3,normalizedIsbn:'9780802158741',shelf:'Weekend reads',status:'Finished',owned:true},
 {entryId:'entry-5',book:4,normalizedIsbn:'9781101947883',shelf:'Personal',status:'Reading',owned:true},
 {entryId:'entry-6',book:5,normalizedIsbn:'9780393356687',shelf:'Personal',status:'Want to read',owned:true}
];
let nextEntryNumber=7;
const shelfMeta={
 'Living room':{visibility:'Friends',auto:true},
 'Weekend reads':{visibility:'Public',auto:true},
 'Personal':{visibility:'Private',auto:false}
};
const screens=[];
const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icon=n=>`<i data-lucide="${n}" aria-hidden="true"></i>`;
const go=(id,label,cls='rd-button',ico='',attrs='')=>`<button type="button" class="${cls}" data-go="${id}" ${attrs}>${ico?icon(ico):''}${label}</button>`;
const act=(id,label,cls='rd-button',ico='')=>`<button type="button" class="${cls}" data-act="${id}" ${id==='flash'?'aria-label="Toggle flashlight"':id==='remove-photo'?'aria-label="Remove attached photo"':''}>${ico?icon(ico):''}${label}</button>`;
const ib=(id,n,label,attrs='')=>`<button type="button" class="rd-iconbtn" data-go="${id}" aria-label="${label}" ${attrs}>${icon(n)}</button>`;
const cover=(i=0,size='')=>`<div class="rd-cover ${size}" style="--cover:${books[i%books.length][2]}" role="img" aria-label="Illustrative cover: ${e(books[i%books.length][0])}"><b>${e(books[i%books.length][0])}</b><small>${e(books[i%books.length][1])}</small></div>`;
const initials=who=>String(who).split(/\s+/).map(part=>part[0]).join('').slice(0,2).toUpperCase();
const avatar=(who='Maya Okonkwo',size='')=>`<span class="rd-avatar ${String(who).toLowerCase().split(' ')[0]} ${size}">${initials(who)}</span>`;
const badge=(label,kind='',ico='')=>`<span class="rd-badge ${kind}">${ico?icon(ico):''}${label}</span>`;
const banner=(text,kind='',ico='info')=>`<div class="rd-banner ${kind}">${icon(ico)}<span>${text}</span></div>`;
const field=(id,label,value='',placeholder='',type='text',hint='')=>`<label class="rd-field" for="rd-${id}">${label}<input id="rd-${id}" type="${type}" value="${e(value)}" placeholder="${e(placeholder)}">${hint?`<small>${hint}</small>`:''}</label>`;
const area=(id,label,value='',placeholder='')=>`<label class="rd-field" for="rd-${id}">${label}<textarea id="rd-${id}" placeholder="${e(placeholder)}">${e(value)}</textarea></label>`;
const radio=(name,value,label,checked=false,sub='')=>`<label class="rd-radio"><input type="radio" name="${name}" value="${value}" ${checked?'checked':''}><span>${label}${sub?`<small>${sub}</small>`:''}</span></label>`;
const toggle=(id,label,checked=true,sub='',disabled=false)=>`<label class="rd-toggle"><span>${label}${sub?`<small>${sub}</small>`:''}</span><input type="checkbox" data-toggle="${id}" aria-label="${label}" ${checked?'checked':''} ${disabled?'disabled':''}></label>`;
const row=(id,label,sub='',ico='chevron-right',attrs='')=>`<button type="button" class="rd-row" data-go="${id}" ${attrs}><span><strong>${label}</strong>${sub?`<small>${sub}</small>`:''}</span>${icon(ico)}</button>`;
const head=(title,sub='',back='',right='')=>`<header class="rd-head">${back?ib(back,'arrow-left','Back'):''}<div><h1>${title}</h1>${sub?`<div class="rd-sub">${sub}</div>`:''}</div>${right}</header>`;
const nav=active=>`<nav class="rd-nav" aria-label="Main navigation">${[['circle','Circle','waypoints'],['library','Library','library-big'],['scanner','Scan','scan-line'],['friends','Friends','users-round'],['profile','Profile','user-round']].map(([id,label,n])=>`<button type="button" data-go="${id}" class="${id==='scanner'?'scan':active===id?'active':''}" ${id==='scanner'?'aria-label="Scan a book"':''} ${active===id?'aria-current="page"':''}>${icon(n)}${id==='scanner'?'':label}</button>`).join('')}</nav>`;
const page=(title,content,{sub='',back='',right='',tab=''}={})=>head(title,sub,back,right)+`<main class="rd-content">${content}</main>`+(tab?nav(tab):'');
const sheet=(title,content,back='library',context='Library')=>`<div class="rd-sheetstage"><div class="rd-sheetback"><h1>${context}</h1><div class="rd-skeleton"></div><div class="rd-skeleton" style="width:65%"></div></div><section class="rd-sheet" role="dialog" aria-label="${e(title)}"><div class="rd-handle"></div><div class="rd-sheetheader"><h2>${title}</h2>${ib(back,'x','Close')}</div>${content}</section></div>`;
const empty=(n,title,text,buttons='')=>`<div class="rd-empty"><div class="rd-emptymark">${icon(n)}</div><h2>${title}</h2><p>${text}</p>${buttons}</div>`;
const section=(title,action='')=>`<div class="rd-sectiontitle"><h2>${title}</h2>${action}</div>`;
const search=(value='',target='search-results',placeholder='Search my books')=>`<form class="rd-search" data-search="${target}">${icon('search')}<input aria-label="${placeholder}" placeholder="${placeholder}" value="${e(value)}"><button type="button" data-search-submit="${target}">Search</button></form>`;
const librarySwitch=explore=>`<div class="rd-segments">${go('library','My Library',!explore?'active':'')}${go('explore','Explore',explore?'active':'')}</div>`;
const filters=()=>`<div class="rd-chips">${['All','Want to read','Reading','Finished'].map(x=>`<button class="rd-chip ${state.filter===x?'active':''}" type="button" data-filter="${x}" aria-pressed="${state.filter===x}">${x}</button>`).join('')}</div>`;
const statusChoices=()=>`<div class="rd-chips">${['Want to read','Reading','Finished'].map(x=>`<button class="rd-chip ${state.status===x?'active':''}" type="button" data-status="${x}" aria-pressed="${state.status===x}">${x}</button>`).join('')}</div>`;
const shelfVisibility=name=>shelfMeta[name]?.visibility||'Friends';
const shelfAuto=name=>Boolean(shelfMeta[name]?.auto&&shelfVisibility(name)!=='Private');
const shelfEntries=name=>libraryEntries.filter(entry=>entry.shelf===name);
const selectedBookIndex=()=>Number.isInteger(state.bookIndex)?state.bookIndex:0;
const bookIdentity=index=>normalizeISBN(books[index]?.[3]||'');
const entryForBook=index=>{const normalizedIsbn=bookIdentity(index);return normalizedIsbn?libraryEntries.find(entry=>entry.normalizedIsbn===normalizedIsbn):libraryEntries.find(entry=>entry.book===index);};
const selectedEntry=()=>entryForBook(selectedBookIndex());
const shelfCard=(name,count,vis,i=0,target='shelf',attrs='')=>`<button class="rd-shelf" type="button" data-go="${target}" data-shelf="${e(name)}" ${attrs}><span class="rd-coverrow">${cover(i,'small')}${cover(i+1,'small')}${cover(i+2,'small')}</span><span class="rd-shelfcopy"><strong>${e(name)}</strong><span class="rd-meta">${count} ${count===1?'book':'books'}</span><br>${badge(vis,vis==='Private'?'':'blue',vis==='Private'?'lock-keyhole':vis==='Public'?'globe-2':'users-round')}</span>${icon('chevron-right')}</button>`;
const bookrow=(i,target='book',status='',owned=null)=>{const entry=libraryEntries.find(item=>item.book===i);const shownStatus=status||entry?.status||'Want to read';const shownOwned=owned===null?(entry?.owned??false):owned;return `<button type="button" class="rd-row" data-go="${target}" data-book="${i}">${cover(i,'small')}<span><strong>${books[i][0]}</strong><small>${books[i][1]}</small><small>${badge(shownStatus,'blue')} ${badge(shownOwned?'Owned':'Not owned',shownOwned?'green':'')}</small></span>${icon('chevron-right')}</button>`;};
const bookgrid=(target='book',indices=libraryEntries.map(entry=>entry.book))=>`<div class="rd-gridbooks">${indices.map(i=>{const entry=libraryEntries.find(item=>item.book===i);return `<button type="button" class="rd-coverbutton" data-go="${target}" data-book="${i}">${cover(i)}<strong>${books[i][0]}</strong><span class="rd-meta">${entry?.status||'Owned'}</span></button>`;}).join('')}</div>`;
const booksummary=(i=selectedBookIndex(),large=false)=>{const normalizedIsbn=bookIdentity(i);return `<div class="rd-book">${cover(i,large?'large':'')}<div><h2>${books[i][0]}</h2><p class="rd-sub">${books[i][1]}</p><p class="rd-meta">${normalizedIsbn?`ISBN ${normalizedIsbn}`:'No ISBN · manual entry'}</p>${large?`<p class="rd-sub">${i<6?'Fiction':'Literary fiction'} · Sample edition</p>`:''}</div></div>`;};
const add=(id,group,title,render)=>screens.push({id,group,title,render});
// Screen definitions follow.
add('login','01 시작과 로그인','로그인',()=>`<main class="rd-content"><div class="rd-loginhero"><div class="rd-logo">${icon('book-open')}</div><div class="rd-loginbrand">READUO</div><h1>Your books.<br>Your people.</h1><p class="rd-sub">A home for your books.<br>A circle for your reading life.</p></div><div class="rd-loginbooks">${cover(1)}${cover(0)}${cover(3)}</div><div class="rd-tight">${go('setup','Continue with Google','rd-button rd-secondary','',`data-provider="Google"`)}${go('setup','Continue with Apple','rd-button','',`data-provider="Apple"`)}</div><p class="rd-meta" style="text-align:center">Sign-in is required for personal and public browsing. This design preview does not contact an identity provider.</p><div class="rd-footertext">By continuing, you agree to our<br>${go('terms','Terms','')}${go('privacy','Privacy notice','')}</div></main>`);
add('login-error','01 시작과 로그인','로그인 실패',()=>page('Let’s try again',empty('log-in','Sign-in didn’t finish','Your library is safe. Check your connection and try signing in again.',go('login','Try again')),{back:'login'}));
add('setup','01 시작과 로그인','프로필 만들기',()=>page('Make yourself at home',`<p class="rd-muted">Choose how you appear to your friends.</p><div style="text-align:center">${avatar('Maya','large')}<br>${go('profile-photo','Add a photo','rd-inline','camera')}</div>${field('name','Display name',state.name,'Your name','text','You can change this later.')}${banner('Your email stays out of your profile.')}<div id="rd-form-error" class="rd-error" role="alert"></div>${act('save-profile','Continue')}`,{sub:'Welcome to Readuo',back:'login'}));
add('profile-photo','01 시작과 로그인','프로필 사진 선택',()=>sheet('Profile photo',`${banner('Interactive design sample · no camera or photo library is opened.','warn','info')}${act('select-profile-photo','Use sample camera photo','rd-button rd-secondary','camera')}${act('select-profile-photo','Use sample library photo','rd-button rd-secondary','image')}${go('photo-denied','Photo access help','rd-button rd-quiet')}`,state.photoReturn||'setup','Your profile'));
add('first-book','01 시작과 로그인','첫 책 추가 안내',()=>page('Your library starts here',`${empty('library-big','Make room for your first book','Scan a barcode and we’ll help fill in the details.',go('camera-permission','Scan my first book','rd-button','scan-line'))}${go('catalogue-search','Search for a book instead','rd-button rd-secondary')}${go('manual-book','Add a book manually','rd-button rd-quiet')}${go('library-empty','I’ll do this later','rd-button rd-quiet')}`,{sub:'Connect with friends whenever you’re ready.'}));
add('terms','01 시작과 로그인','이용 규칙',()=>page('Community guidelines',`<div class="rd-policy"><h2>A considerate reading space</h2><h3>Be kind to other readers</h3><p>Keep posts, reviews, comments, and profile content respectful. Harassment and abusive content are not welcome.</p><h3>Share responsibly</h3><p>Only upload photos and text you have permission to share. Avoid posting someone else’s personal information.</p><h3>Get help</h3><p>Use Report on a post, comment, or profile when something is wrong. Blocking stops new requests and interactions. Contact support from Profile for additional help.</p></div>${go('report','Report a concern','rd-button rd-secondary','flag','data-report-context="terms"')}`,{back:state.infoReturn||'login'}));
add('privacy','01 시작과 로그인','공개 범위 안내',()=>page('Your privacy',`<div class="rd-policy"><h2>Your shelves, your choice</h2><h3>Friends</h3><p>The default for new shelves. Only accepted friends can browse these shelves.</p><h3>Private</h3><p>Only you can see the shelf. Its activity and reviews stop appearing in shared views when access is revoked. Previously cached social data must not be promised as instantly erased offline.</p><h3>Public</h3><p>Any signed-in Readuo user can discover owned books on the shelf. Circle is still friends only.</p><h3>Automatic activity</h3><p>Control this separately for each shelf. Private shelves never post automatically.</p><h3>Your account</h3><p>You can request account deletion from Profile settings.</p></div>`,{back:state.infoReturn||'login'}));

const feedReview=()=>`<article class="rd-card"><div class="rd-person">${avatar('Sarah Lin')}<div><strong>Sarah Lin</strong><div class="rd-meta">Reviewed · 2h ago</div></div>${ib('post-menu','ellipsis','Post options','data-friend="sarah"')}</div><div style="margin-top:16px" class="rd-book">${cover(6)}<div><h3>${books[6][0]}</h3><div class="rd-meta">${books[6][1]}</div><div class="rd-stars" aria-label="5 out of 5 stars">★★★★★</div><p>A quiet, luminous story about time and connection.</p></div></div><div class="rd-actions">${act('like',`${icon('heart')} ${state.liked?13:12}`,'rd-action')}${go('post','2'+state.comments.length,'rd-action','message-circle')}${go(libraryEntries.some(entry=>entry.book===6)?'book':'save-shelf',libraryEntries.some(entry=>entry.book===6)?'In library':'Want to read','rd-action','bookmark',`data-book="6" data-friend="sarah"`)}</div></article>`;
const ownPostCard=()=>state.ownPost?`<article class="rd-card"><div class="rd-person">${avatar(state.name)}<div><strong>You</strong><div class="rd-meta">Posted · Just now</div></div>${ib('own-post-menu','ellipsis','Your post options')}</div><p style="margin-top:14px">${e(state.ownPost.text)}</p>${state.ownPost.photo?`<div class="rd-photo" aria-label="Illustrative attached photo of books" style="margin-top:14px">${cover(0)}${cover(1)}</div>`:''}${state.ownPost.book!==null?`<div class="rd-book" style="margin-top:14px">${cover(state.ownPost.book,'small')}<div><strong>${e(books[state.ownPost.book][0])}</strong><p class="rd-meta">${e(books[state.ownPost.book][1])}</p></div></div>`:''}</article>`:'';
add('circle','02 Circle','Circle 피드',()=>page('Circle',`${go('compose',`${avatar(state.name)}<span style="flex:1;text-align:left;color:#58667b">Share a thought…</span>${icon('image')}`,'rd-shelf')}${ownPostCard()}${feedReview()}<article class="rd-card"><div class="rd-person">${avatar('Tom Bergen')}<div><strong>Tom added 3 books</strong><div class="rd-meta">Weekend stories · 4h ago</div></div>${ib('post-menu','ellipsis','Activity options','data-friend="tom"')}</div><div class="rd-coverrow" style="margin-top:14px">${[1,2,4].map(i=>go('friend-book',cover(i),'rd-coverbutton','',`data-book="${i}" data-friend="tom"`)).join('')}</div></article><div class="rd-card rd-person">${avatar('Amara Reyes')}<div><strong>Amara started reading Dune</strong><div class="rd-meta">Yesterday</div></div>${go('friend-book',cover(1,'small'),'rd-coverbutton','',`data-book="1" data-friend="amara"`)}${ib('post-menu','ellipsis','Activity options','data-friend="amara"')}</div>${act('refresh','Refresh Circle','rd-button rd-quiet','refresh-cw')}`,{sub:'Friends only · newest first',right:ib('notifications','bell','Notifications'),tab:'circle'}));
add('circle-empty','02 Circle','Circle 빈 상태',()=>page('Circle',`${empty('users-round','A little quiet, for now','Your friends’ posts and reading updates will appear here.',go('invite','Invite a friend','rd-button','user-plus'))}${go('compose','Share your first post','rd-button rd-secondary')}${go('library','Visit my library','rd-button rd-quiet')}`,{sub:'Friends only',right:ib('notifications-empty','bell','Notifications'),tab:'circle'}));
const composeBody=(editing=false)=>`${banner('Only your accepted friends can see this post.','', 'users-round')}${area('post-text','Your post',state.draft||(editing?state.ownPost?.text||'':''),'What’s on your mind?')}${state.photo?`<div class="rd-photo" aria-label="Sample attached photo of books">${cover(0)}${cover(1)}${act('remove-photo',icon('x'),'rd-iconbtn')}</div>`:''}${state.attachedBook!==null?`<div class="rd-card">${booksummary(state.attachedBook)}${act('detach-book','Remove book attachment','rd-inline')}</div>`:''}<div class="rd-twocol">${act('add-photo','Add photo','rd-button rd-secondary','image')}${go('attach-book','Attach book','rd-button rd-secondary','book-open')}</div><div id="rd-form-error" class="rd-error" role="alert"></div>${act(editing?'save-edit':'publish',editing?'Save changes':'Post to Circle')}`;
add('compose','02 Circle','일반 게시물 작성',()=>page('New post',composeBody(),{back:'circle'}));
add('compose-photo','02 Circle','사진 첨부 게시물',()=>{state.photo=true;if(!state.draft)state.draft='A quiet Sunday with these two.';return page('New post',composeBody(),{back:'circle'});});
add('attach-book','02 Circle','게시물에 책 첨부',()=>page('Attach a book',`${search(state.attachQuery||'','attach-book','Search your library')}<p class="rd-meta">Choose one optional book attachment from your own library.</p>${libraryEntries.filter(entry=>!state.attachQuery||books[entry.book].join(' ').toLowerCase().includes(state.attachQuery.toLowerCase())).map(entry=>`<button class="rd-row" type="button" data-act="attach" data-book="${entry.book}">${cover(entry.book,'small')}<span><strong>${books[entry.book][0]}</strong><small>${books[entry.book][1]}</small></span>${icon('plus')}</button>`).join('')||empty('search','No books found','Try another title or author.')}`,{back:'compose'}));
add('review','02 Circle','서평과 별점 작성',()=>{const entry=selectedEntry();return page('Write a review',`${booksummary(selectedBookIndex())}<p class="rd-sub">Visible to friends · ${e(entry?.shelf||state.shelf)} shelf</p><label class="rd-field">Your rating <span class="rd-muted">(optional)</span></label><div class="rd-rating">${[1,2,3,4,5].map(n=>`<button type="button" data-rating="${n}" aria-label="Rate ${n} stars" aria-pressed="${n<=state.rating}">${n<=state.rating?'★':'☆'}</button>`).join('')}</div>${area('review-text','Your review',state.reviewDraft,'What stayed with you?')}${banner('Spoilers ahead? Give your friends a heads-up in your review.')}<div id="rd-form-error" class="rd-error" role="alert"></div>${act('publish-review','Publish review')}`,{back:'book'});});
add('post','02 Circle','게시물과 댓글',()=>page('Post',`${feedReview()}${section('Comments · '+(1+(state.ownComment?1:0)+state.comments.length))}<div class="rd-comment">${avatar('Tom Bergen')}<div><strong>Tom Bergen</strong><p>Adding this to my list. That’s exactly my kind of book.</p><span class="rd-meta">1h ago</span></div>${ib('comment-menu','ellipsis','Comment options')}</div>${state.ownComment?`<div class="rd-comment">${avatar(state.name)}<div><strong>You</strong><p>${e(state.ownComment)}</p><span class="rd-meta">45m ago</span></div>${ib('own-comment-menu','ellipsis','Your comment options')}</div>`:''}${state.comments.map(c=>`<div class="rd-comment">${avatar(state.name)}<div><strong>You</strong><p>${e(c)}</p><span class="rd-meta">Just now</span></div></div>`).join('')}${field('comment','Add a comment','','Write a thoughtful reply…')}<div id="rd-form-error" class="rd-error" role="alert"></div>${act('comment','Send comment')}`,{back:'circle'}));
add('post-menu','02 Circle','타인 게시물 메뉴',()=>{const reader=activeReader();return sheet('Post options',`${row('friend-profile',`View ${e(reader.name)}’s profile`,'','user-round',`data-friend="${reader.id}"`)}${row('report','Report this post','','flag','data-report-context="post"')}`,'circle','Circle');});
add('own-post-menu','02 Circle','내 게시물 메뉴',()=>sheet('Your post',`${row('edit-post','Edit post','','pencil')}${row('delete-post','Delete post','','trash-2')}`,'circle','Circle'));
add('edit-post','02 Circle','게시물 수정',()=>page('Edit post',composeBody(true),{back:'own-post-menu'}));

add('notifications','02 Circle','알림 목록',()=>page('Notifications',`${state.incomingRequestIds.includes('priya')?row('request-detail','Priya Shah sent you a friend request','Just now','user-plus','data-request="priya"'):''}${row('friend-profile','Tom accepted your request','You’re now connected · 1h ago','users-round','data-friend="tom"')}${row('post','Amara commented on your post','“This looks like a perfect Sunday.” · 2h ago','message-circle')}${row('post','Sarah liked your review','Sea of Tranquility · Yesterday','heart')}`,{back:'circle',right:ib('notification-settings','settings-2','Notification settings')}));

add('library','03 내 서재','내 서재 · 책장',()=>{const names=[...new Set(libraryEntries.map(entry=>entry.shelf))];return page('Library',`${librarySwitch(false)}${search()}${section('My shelves',go('create-shelf','New shelf','rd-inline','plus'))}<div class="rd-meta">${libraryEntries.length} books · ${names.length} shelves</div>${names.map((name,index)=>shelfCard(name,shelfEntries(name).length,shelfVisibility(name),index*2)).join('')}${section('My books',go('library-books','View all','rd-inline','arrow-right'))}${libraryEntries.slice(0,2).map(entry=>bookrow(entry.book)).join('')}`,{tab:'library'});});
add('library-books','03 내 서재','내 서재 · 책 목록',()=>{let entries=libraryEntries.filter(entry=>state.filter==='All'||entry.status===state.filter);entries=[...entries].sort((left,right)=>state.sort==='title'?books[left.book][0].localeCompare(books[right.book][0]):state.sort==='author'?books[left.book][1].localeCompare(books[right.book][1]):right.book-left.book);return page('My books',`${search()}${filters()}${section(`${entries.length} ${state.filter==='All'?'books':state.filter.toLowerCase()}`,go('sort-books','Sort','rd-inline','arrow-down-up'))}${entries.length?entries.map(entry=>bookrow(entry.book)).join(''):empty('book-check','No books in this status','Choose another status or update a book.',go('library-books','Show all books','rd-button rd-secondary'))}`,{back:'library',tab:'library'});});
add('sort-books','03 내 서재','책 정렬',()=>sheet('Sort books',`${radio('sort','recent','Recently added',state.sort==='recent')}${radio('sort','title','Title · A to Z',state.sort==='title')}${radio('sort','author','Author · A to Z',state.sort==='author')}${act('sort','Apply')}`,'library-books'));
add('library-empty','03 내 서재','내 서재 빈 상태',()=>page('Library',`${librarySwitch(false)}${empty('library-big','Your first shelf awaits','Add a book and choose a shelf to make it yours.',go('camera-permission','Scan a book','rd-button','scan-line'))}${go('catalogue-search','Search for a book','rd-button rd-secondary')}${go('create-shelf','Create a shelf first','rd-button rd-quiet','plus')}`,{tab:'library'}));
add('search-results','03 내 서재','내 서재 검색 결과',()=>{const query=state.query||'Dune';const matches=libraryEntries.filter(entry=>books[entry.book].join(' ').toLowerCase().includes(query.toLowerCase()));const shelfMatches=[...new Set(matches.map(entry=>entry.shelf))];return page('Search my library',`${search(query)}<p class="rd-meta">${matches.length} ${matches.length===1?'book':'books'} · Owned and saved entries</p>${matches.map(entry=>bookrow(entry.book)).join('')}${shelfMatches.length?section('Containing shelves'):''}${shelfMatches.map(name=>row('shelf',name,`${shelfEntries(name).length} books`,'library-big',`data-shelf="${e(name)}"`)).join('')}`,{back:'library'});});
add('search-empty','03 내 서재','검색 결과 없음',()=>page('Search my library',`${search('A book I haven’t added')} ${empty('search','No matches in your library','Try another title, author, or ISBN. You can search the catalogue to add a new book.',go('catalogue-search','Search catalogue','rd-button rd-secondary'))}`,{back:'library'}));
add('filter-empty','03 내 서재','상태 필터 결과 없음',()=>page('My books',`${filters()}${empty('book-check','No books in this status','Change a book’s status or show all books.',act('clear-filter','Show all books','rd-button rd-secondary'))}`,{back:'library',tab:'library'}));
add('shelf','03 내 서재','내 책장 상세',()=>{const entries=shelfEntries(state.shelf).filter(entry=>state.filter==='All'||entry.status===state.filter);return page(e(state.shelf),`${badge(state.visibility,state.visibility==='Private'?'':'blue',state.visibility==='Private'?'lock-keyhole':state.visibility==='Public'?'globe-2':'users-round')}<p class="rd-sub">${shelfEntries(state.shelf).length} books · ${state.auto&&state.visibility!=='Private'?'Automatic activity on':'Automatic activity off'}</p><div class="rd-twocol">${go('scanner','Scan into shelf','rd-button','scan-line')}${go('shelf-settings','Shelf settings','rd-button rd-secondary','settings-2')}</div>${filters()}${entries.length?bookgrid('book',entries.map(entry=>entry.book)):empty('book-check','No books in this status','Choose another status filter.')}`,{back:'library',right:ib('shelf-settings','ellipsis','Shelf options'),tab:'library'});});
add('shelf-empty','03 내 서재','빈 책장',()=>page(e(state.shelf),`${badge(state.visibility,'blue')}${empty('book-plus','Ready for a good book','Books you add here will stay on this shelf until you move them.',go('scanner','Scan into this shelf','rd-button','scan-line'))}${go('catalogue-search','Search catalogue','rd-button rd-secondary')}`,{back:'library',right:ib('shelf-settings','settings-2','Shelf settings'),tab:'library'}));
add('create-shelf','03 내 서재','책장 만들기',()=>page('New shelf',`${field('shelf-name','Shelf name','','e.g. Living room')}${field('shelf-description','Description (optional)','','What belongs here?')}${section('Who can see this shelf?')}${radio('visibility','Friends','Friends',true,'Your accepted friends')}${radio('visibility','Private','Private',false,'Only you')}${radio('visibility','Public','Public',false,'Any signed-in Readuo user')}${toggle('create-auto','Share activity to Circle',true,'Book additions, starting, and finishing. Circle stays friends only.')}<div id="rd-form-error" class="rd-error" role="alert"></div>${act('create-shelf','Create shelf')}`,{back:'library'}));
add('shelf-settings','03 내 서재','책장 설정',()=>page('Shelf settings',`${field('shelf-name','Shelf name',state.shelf)}${field('shelf-description','Description (optional)','','What belongs here?')}${section('Visibility')}${['Friends','Private','Public'].map(x=>radio('visibility',x,x,state.visibility===x,x==='Friends'?'Your accepted friends':x==='Private'?'Only you':'Any signed-in Readuo user')).join('')}${toggle('auto','Share activity to Circle',state.auto&&state.visibility!=='Private','This setting applies only to this shelf.',state.visibility==='Private')}${state.visibility==='Private'?banner('Private shelves never post to Circle.'):''}<div id="rd-form-error" class="rd-error" role="alert"></div>${act('save-shelf','Save changes')}${go('delete-shelf','Delete shelf','rd-button rd-quiet','trash-2')}`,{back:'shelf'}));
add('private-confirm','03 내 서재','비공개 전환 확인',()=>sheet('Make this shelf private?',`<p>Only you will be able to see its books. Earlier activity from this shelf will also disappear from your friends’ Circle feeds.</p>${banner('Automatic posting will be turned off.','', 'lock-keyhole')}${act('make-private','Make private')}${go('shelf-settings','Keep current visibility','rd-button rd-secondary')}`,'shelf-settings'));
add('delete-shelf','03 내 서재','책장 삭제 방법',()=>page('Delete shelf',`<div class="rd-card"><h3>${e(state.shelf)}</h3><p class="rd-sub">${shelfEntries(state.shelf).length} books</p></div><p>What would you like to do with the books?</p>${row('move-all','Move books to another shelf','Keep every book in your library','folder-input')}${row('delete-shelf-confirm','Remove shelf and books','Remove these entries from your library','trash-2')}${go('shelf','Cancel','rd-button rd-secondary')}`,{back:'shelf-settings'}));
add('move-all','03 내 서재','책 전체 이동 후 책장 삭제',()=>{const destinations=[...new Set(libraryEntries.map(entry=>entry.shelf))].filter(name=>name!==state.shelf);if(state.newShelf&&!destinations.includes(state.newShelf))destinations.push(state.newShelf);return page('Move books first',`<p class="rd-muted">Choose a destination for all ${shelfEntries(state.shelf).length} books. Then ${e(state.shelf)} will be deleted.</p>${destinations.map((name,index)=>radio('destination',name,name,index===0,`${shelfEntries(name).length} books · ${shelfVisibility(name)}`)).join('')}${banner('The destination shelf’s visibility will apply to the moved books, and inaccessible derived social activity must be removed.','warn')}${go('create-shelf','Create another shelf','rd-inline','plus')}${act('move-all','Move books & delete shelf')}`,{back:'delete-shelf'});});
add('delete-shelf-confirm','03 내 서재','책장과 책 삭제 확인',()=>sheet(`Remove shelf and ${shelfEntries(state.shelf).length} books?`,`<p>These library entries, shelf-derived activity, associated reviews, and their comment and like threads will be removed from shared views. This cannot be undone.</p>${act('delete-shelf','Remove shelf and books','rd-button rd-danger')}${go('delete-shelf','Go back','rd-button rd-secondary')}`,'delete-shelf'));
add('book','03 내 서재','소유한 책 상세',()=>{const entry=selectedEntry();if(entry){state.shelf=entry.shelf;state.visibility=shelfVisibility(entry.shelf);state.auto=shelfAuto(entry.shelf);state.status=entry.status;state.owned=entry.owned;}const descriptions=['A mysterious house, endless halls, and an extraordinary world waiting to be explored.','A young heir enters a desert world shaped by power, ecology, and prophecy.','A library between life and death offers a chance to explore paths not taken.','A coal merchant faces a difficult choice in a small Irish town.','Stories exploring technology, choice, and what it means to be human.','Interconnected lives reveal a world shaped by trees.','A journey across time that asks how art and relationships endure.','A reflection on plants, reciprocity, and ways of knowing.'];return page('Book details',`${booksummary(selectedBookIndex(),true)}<div class="rd-chips">${badge(state.owned?'Owned':'Not owned',state.owned?'green':'',state.owned?'check':'')}${badge(state.status,'blue')}</div>${row('shelf','On '+e(state.shelf),state.visibility+' shelf','library-big',`data-shelf="${e(state.shelf)}"`)}${go('reading-status','Change reading status','rd-button rd-secondary','book-open')}${toggle('owned','I own this book',state.owned,'Ownership is separate from reading status. Turning it off removes this book from social discovery.')}${section('My review',go('review',state.reviewPublished?'Edit review':'Write a review','rd-inline','pencil'))}<p class="rd-meta">${state.reviewPublished?e(state.reviewDraft):'Add an optional rating and share what you thought.'}</p><hr class="rd-rule">${section('About this book')}<p class="rd-muted">${e(descriptions[selectedBookIndex()]||state.manualDescription||'No description provided.')}</p>`,{back:'library',right:ib('book-menu','ellipsis','Book options'),tab:'library'});});
add('saved-book','03 내 서재','소유하지 않은 읽고 싶은 책',()=>{const saved=libraryEntries.find(entry=>!entry.owned)||libraryEntries[0];state.bookIndex=saved.book;state.shelf=saved.shelf;state.status=saved.status;state.owned=saved.owned;state.visibility=shelfVisibility(saved.shelf);return page('Book details',`${booksummary(saved.book,true)}<div class="rd-chips">${badge(saved.owned?'Owned':'Not owned',saved.owned?'green':'')}${badge(saved.status,'blue')}</div>${row('shelf','On '+e(saved.shelf),'Saved from an accessible shelf','library-big',`data-shelf="${e(saved.shelf)}"`)}${toggle('owned','I own this book',saved.owned,'Turn this on if you get a physical copy. Ownership controls social discovery, not reading status.')}${banner('This book appears in your own search. It appears in discovery only while marked owned on an accessible shelf.')}${go('reading-status','Change reading status','rd-button rd-secondary')}${go('review','Write a review','rd-button rd-secondary')}`,{back:'library',right:ib('book-menu','ellipsis','Book options'),tab:'library'});});
add('book-menu','03 내 서재','책 관리 메뉴',()=>sheet('Manage book',`${row('move-book','Move to another shelf','','folder-input')}${row('remove-book','Remove from my library','','trash-2')}`,'book'));
add('reading-status','03 내 서재','읽기 상태 변경',()=>sheet('Reading status',`${booksummary(selectedBookIndex())}${['Want to read','Reading','Finished'].map(x=>radio('reading',x,x,state.status===x)).join('')}${state.auto&&state.visibility!=='Private'?banner('Starting or finishing this book will create one friends-only Circle update for this shelf.'):banner('This shelf is not sharing automatic activity.')}${act('save-status','Save status')}`,'book'));
add('move-book','03 내 서재','책 이동',()=>{const entry=selectedEntry();return sheet('Move to a shelf',`<p class="rd-meta">${e(books[selectedBookIndex()][0])} is currently on ${e(entry?.shelf||state.shelf)}.</p>${[...new Set(libraryEntries.map(item=>item.shelf))].filter(name=>name!==(entry?.shelf||state.shelf)).map((name,index)=>radio('destination',name,name,index===0,shelfVisibility(name))).join('')}${banner('The destination shelf’s visibility applies immediately. Revoke inaccessible social and discovery views, subject to documented offline-cache limits.','warn')}${act('move-book','Move book')}`,'book');});
add('remove-book','03 내 서재','책 삭제 확인',()=>sheet('Remove from your library?',`${booksummary(selectedBookIndex())}<p>This removes the single library entry, shelf-derived activity, and any associated review thread from shared views. You can add the book again later.</p>${act('remove-book','Remove book','rd-button rd-danger')}${go('book','Keep book','rd-button rd-secondary')}`,'book'));
const exploreCard=(readerId,shelf,count,indices)=>{const reader=allReaders().find(person=>person.id===readerId);return `<article class="rd-card"><div class="rd-person">${friendAvatar(reader)}<div><strong>${e(reader.name)}’s collection</strong><div class="rd-meta">Shared with you</div></div>${go('friend-profile',icon('chevron-right'),'rd-iconbtn','',`aria-label="View ${e(reader.name)} profile" data-friend="${reader.id}"`)}</div><div class="rd-coverrow" style="justify-content:space-between;margin:16px 0">${indices.map(index=>go('friend-book',cover(index),'rd-coverbutton','',`data-book="${index}" data-friend="${reader.id}" data-remote-shelf="${e(shelf)}"`)).join('')}</div>${row('friend-shelf',shelf,count+' owned books','chevron-right',`data-friend="${reader.id}" data-remote-shelf="${e(shelf)}"`)}</article>`;};
const exploreTabs=pub=>`<div class="rd-chips">${go('explore','Friends','rd-chip '+(!pub?'active':''))}${go('explore-public','Public','rd-chip '+(pub?'active':''))}</div>`;
add('explore','04 Explore','친구 컬렉션 탐색',()=>page('Library',`${librarySwitch(true)}${search('','explore-results','Title, author or ISBN')}${exploreTabs(false)}${section('From your friends')}${exploreCard('sarah','Desert reads',9,[6,1,4])}${exploreCard('tom','Weekend stories',14,[7,2,5])}`,{tab:'library'}));
add('explore-public','04 Explore','공개 컬렉션 탐색',()=>page('Library',`${librarySwitch(true)}${search('','explore-results','Title, author or ISBN')}${exploreTabs(true)}${section('Public collections')}<p class="rd-meta">Only books marked owned on Public shelves appear here.</p><article class="rd-card"><div class="rd-person">${friendAvatar(publicReader)}<div><strong>${e(publicReader.name)}</strong><div class="rd-meta">Public collection · not connected</div></div>${go('public-profile',icon('chevron-right'),'rd-iconbtn','',`aria-label="View ${e(publicReader.name)} profile" data-friend="${publicReader.id}"`)}</div><div class="rd-coverrow" style="justify-content:space-between;margin:16px 0">${[7,3,6].map(index=>go('public-book',cover(index),'rd-coverbutton','',`data-book="${index}" data-friend="${publicReader.id}" data-remote-shelf="Field notes"`)).join('')}</div>${row('public-shelf','Field notes','18 owned books','chevron-right',`data-friend="${publicReader.id}" data-remote-shelf="Field notes"`)}</article>${shelfCard('Quiet futures',11,'Public',6,'public-shelf',`data-friend="${publicReader.id}" data-remote-shelf="Quiet futures"`)}`,{tab:'library'}));
add('explore-results','04 Explore','도서 발견 검색 결과',()=>{const query=state.query||'Sea of Tranquility';const match=books.findIndex(book=>book.join(' ').toLowerCase().includes(query.toLowerCase()));const index=match<0?6:match;return page('Explore search',`${search(query,'explore-results','Title, author or ISBN')}${exploreTabs(false)}<p class="rd-meta">Readers who marked this edition as owned on an accessible shelf</p>${booksummary(index)}${row('friend-shelf','Sarah Lin','Desert reads · Friends shelf','users-round',`data-friend="sarah" data-book="${index}" data-remote-shelf="Desert reads"`)}${row('public-shelf',publicReader.name,'Field notes · Public shelf','globe-2',`data-friend="${publicReader.id}" data-book="${index}" data-remote-shelf="Field notes"`)}`,{back:'explore'});});
add('explore-empty','04 Explore','공유된 친구 책장 없음',()=>page('Library',`${librarySwitch(true)}${exploreTabs(false)}${empty('library-big','No shared books yet','Your friends haven’t shared any owned books with you yet.',go('explore-public','Explore public shelves','rd-button rd-secondary'))}${go('invite','Invite another friend','rd-button rd-quiet')}`,{tab:'library'}));
add('explore-no-results','04 Explore','발견 검색 결과 없음',()=>page('Explore search',`${search('An undiscovered title','explore-results','Title, author or ISBN')}${exploreTabs(false)}${empty('search','No matching owned books','Try a different title, author, or ISBN, or look in public collections.',go('explore-public','Search public collections','rd-button rd-secondary'))}`,{back:'explore'}));
add('friend-shelf','04 Explore','친구 책장 상세 · 읽기 전용',()=>{const reader=activeReader();const shelf=state.remoteShelf||reader.shelves[0]?.[0]||'Shared shelf';const indices=reader.id==='tom'?[7,2,5]:[6,1,4];return page(e(shelf),`${go('friend-profile',`${friendAvatar(reader)}<span>${e(reader.name)}</span>`,'rd-inline','',`data-friend="${reader.id}"`)}${badge('Shared with friends','blue')}<p class="rd-sub">Owned books · Read-only</p>${bookgrid('friend-book',indices)}`,{back:'explore',tab:'library'});});
add('public-shelf','04 Explore','공개 책장 상세 · 읽기 전용',()=>page(e(state.remoteShelf||'Field notes'),`${go('public-profile',`${friendAvatar(publicReader)}<span>${e(publicReader.name)}</span>`,'rd-inline')}${badge('Public','blue','globe-2')}<p class="rd-sub">Owned books · Read-only for signed-in users</p>${bookgrid('public-book',[7,3,6])}`,{back:'explore-public',tab:'library'}));
const discoverBook=publicBook=>{const index=selectedBookIndex();const owner=publicBook?publicReader:activeReader();const existing=entryForBook(index);return sheet('A book to discover',`${booksummary(index,true)}<div class="rd-person">${friendAvatar(owner)}<div><strong>${e(owner.name)} owns this book</strong><div class="rd-meta">${e(state.remoteShelf||(publicBook?'Field notes':'Desert reads'))}</div></div></div>${go(existing?'book':'save-shelf',existing?'View your library entry':'Want to read','rd-button',existing?'book-open':'bookmark-plus',`data-book="${index}"`)}${go(publicBook?'public-shelf':'friend-shelf','See the shelf','rd-button rd-secondary','library-big')}<p class="rd-meta">Saving defaults to Want to read and not owned. The same normalized ISBN reuses the existing entry; another ISBN remains separate.</p>`,publicBook?'public-shelf':'explore','Explore');};
add('friend-book','04 Explore','친구 책 상세 패널',()=>discoverBook(false));
add('public-book','04 Explore','공개 컬렉션의 책',()=>discoverBook(true));
add('save-shelf','04 Explore','읽고 싶은 책 저장 · 책장 선택',()=>{const existing=selectedEntry();const shelfNames=[...new Set(libraryEntries.map(entry=>entry.shelf))];if(state.newShelf&&!shelfNames.includes(state.newShelf))shelfNames.push(state.newShelf);return sheet(existing?'Already in your library':'Save to your library',`${booksummary(selectedBookIndex())}${existing?banner(`The same normalized ISBN is already on ${e(existing.shelf)} as ${e(existing.status)}. Saving again keeps that entry unchanged; a different ISBN may be saved separately.`,'warn','copy-check'):`${badge('Want to read','blue')}<p class="rd-meta">Choose exactly one shelf for this ISBN-specific book entry.</p>${shelfNames.map((name,index)=>radio('destination',name,name,index===0,shelfVisibility(name))).join('')}${go('create-shelf','Create a new shelf','rd-inline','plus')}${toggle('save-owned','I already own this book',false)}${act('save-book','Save book')}`}${existing?go('book','View existing entry','rd-button','book-open',`data-book="${existing.book}"`):''}`,'explore','Explore');});
add('book-saved','04 Explore','저장 완료',()=>page('Saved',`${empty('bookmark-check','On your reading list',`${e(books[selectedBookIndex()][0])} has been added to ${e(state.shelf)} as Want to read.`,go('book','View book','rd-button','book-open',`data-book="${selectedBookIndex()}"`))}${go('explore','Keep exploring','rd-button rd-secondary')}`,{back:'explore'}));
add('unavailable','04 Explore','비공개 또는 접근 불가',()=>page('Shelf unavailable',empty('lock-keyhole','This shelf isn’t available','It may be private, removed, or no longer shared with you.',go('explore','Back to Explore')),{back:'explore'}));

add('scan-loading','05 책 추가와 스캔','ISBN 조회 중',()=>`${camera(true)}<main class="rd-content"><div class="rd-card"><div class="rd-book"><div style="height:112px;width:76px;background:#e5eaf2;border-radius:8px"></div><div><h3>Finding your book…</h3><p class="rd-sub">Sample catalogue lookup state</p><div class="rd-skeleton"></div><div class="rd-skeleton" style="width:65%"></div></div></div></div>${go('scan-found','Continue with sample result','rd-button','arrow-right',`data-book="6"`)}${go('scanner','Cancel','rd-button rd-secondary')}</main>`);
const foundBody=()=>{const shelfNames=[...new Set(libraryEntries.map(entry=>entry.shelf))];if(state.newShelf&&!shelfNames.includes(state.newShelf))shelfNames.push(state.newShelf);return `${booksummary(selectedBookIndex())}${go('catalogue-search','Not this book?','rd-inline')}<label class="rd-field">Shelf · Required<select id="rd-destination">${state.onboarding&&!state.newShelf?'<option value="">Create your first shelf</option>':shelfNames.map(name=>`<option ${state.shelf===name?'selected':''}>${e(name)}</option>`).join('')}</select></label>${go('create-shelf','Create a new shelf','rd-inline','plus')}${toggle('owned','I own this book',state.owned)}<label class="rd-field">Reading status</label>${statusChoices()}<div id="rd-form-error" class="rd-error" role="alert"></div>${act('add-scan','Add book')}${act('add-batch','Save & scan another','rd-button rd-secondary')}`;};
add('scan-found','05 책 추가와 스캔','책 발견 · 확인',()=>`${camera(true)}<section class="rd-sheet"><div class="rd-handle"></div>${badge('Book found','green','check')}${foundBody()}</section>`);
add('scan-duplicate','05 책 추가와 스캔','이미 있는 책',()=>{const existing=selectedEntry()||libraryEntries[0];state.bookIndex=existing.book;return sheet('Already in your library',`${booksummary(existing.book)}${banner(`The same normalized ISBN is already on ${e(existing.shelf)} as ${e(existing.status)}. We’ll preserve that entry instead of adding, moving, or resetting it.`)} ${go('book','View existing book','rd-button','book-open',`data-book="${existing.book}"`)}${go('move-book','Move to another shelf','rd-button rd-secondary')}${go('scanner','Scan another book','rd-button rd-quiet')}`,'scanner','Scan a book');});
add('manual-isbn','05 책 추가와 스캔','ISBN 직접 입력',()=>page('Enter ISBN',`${field('isbn','ISBN','','978…','text','Find the 10- or 13-digit number near the book’s barcode.')}<div id="rd-form-error" class="rd-error" role="alert"></div>${act('lookup-isbn','Find book')}${go('catalogue-search','Search by title instead','rd-button rd-quiet')}`,{back:'scanner'}));
add('isbn-not-found','05 책 추가와 스캔','ISBN 조회 결과 없음',()=>page('Book not found',`${empty('book-search','No match this time','Try searching by title, or add the details yourself.',go('catalogue-search','Search catalogue'))}${go('manual-book','Add manually','rd-button rd-secondary')}${go('manual-isbn','Check the ISBN','rd-button rd-quiet')}`,{back:'scanner'}));
add('catalogue-search','05 책 추가와 스캔','외부 도서 검색',()=>page('Find a book',`${search('','catalogue-results','Title, author or ISBN')}${empty('search','Find your next addition','Search the catalogue, then choose the matching book and edition.')} ${go('manual-book','Can’t find it? Add manually','rd-button rd-quiet')}`,{back:'scanner'}));
add('catalogue-results','05 책 추가와 스캔','도서 검색 결과 · 판본',()=>{const query=state.query||'Piranesi';const match=books.findIndex(book=>book.join(' ').toLowerCase().includes(query.toLowerCase()));const index=match<0?0:match;const editions=books.map((book,bookIndex)=>({book,bookIndex})).filter(item=>item.book[0]===books[index][0]&&item.book[1]===books[index][1]);return page('Find a book',`${search(query,'catalogue-results','Title, author or ISBN')}<p class="rd-meta">Choose the ISBN-specific edition you own or want to save. Different ISBNs remain separate books.</p>${editions.map(({book,bookIndex},edition)=>`<button class="rd-row" type="button" data-go="scan-found" data-book="${bookIndex}">${cover(bookIndex,'small')}<span><strong>${e(book[0])}</strong><small>${e(book[1])}</small><small>ISBN ${e(book[3])}<br>${edition===0?'Hardcover':edition===1?'Paperback':'Illustrated edition'}</small></span>${icon('chevron-right')}</button>`).join('')}${go('manual-book','None of these? Add manually','rd-button rd-quiet')}`,{back:'catalogue-search'});});
add('catalogue-no-results','05 책 추가와 스캔','도서 검색 결과 없음',()=>page('Find a book',`${search(state.query||'Unknown title','catalogue-results','Title, author or ISBN')}${empty('book-search','No catalogue matches','Try another title or author, or enter the book details yourself.',go('manual-book','Add manually','rd-button rd-secondary'))}${go('manual-isbn','Enter an ISBN','rd-button rd-quiet')}`,{back:'catalogue-search'}));
add('manual-book','05 책 추가와 스캔','도서 직접 등록',()=>page('Add a book',`${go('book-photo',state.manualPhoto?'Cover photo selected':'Add cover photo (optional)','rd-button rd-secondary','image-plus')}${field('book-title','Title · Required',state.manualTitle,'Book title')}${field('book-author','Author · Required',state.manualAuthor,'Author name')}${field('book-isbn','ISBN (optional)',state.manualIsbn,'ISBN, if available')}${field('book-publisher','Publisher (optional)',state.manualPublisher,'Publisher')}${field('book-year','Published year (optional)',state.manualYear,'Year','number')}${area('book-description','Description (optional)',state.manualDescription,'A few words about this book')}<div id="rd-form-error" class="rd-error" role="alert"></div>${banner('ISBN-10 is normalized to its equivalent ISBN-13. Without an ISBN, the entry gets a unique ID; title and author can flag a possible duplicate for review but never cause a silent merge.')}${act('manual-next','Choose shelf & status')}`,{back:'catalogue-search'}));
add('book-photo','05 책 추가와 스캔','표지 사진 선택',()=>sheet('Book cover',`${act('select-cover-photo','Use sample camera photo','rd-button rd-secondary','camera')}${act('select-cover-photo','Use sample library photo','rd-button rd-secondary','image')}${act('remove-cover-photo','Use a generated title cover','rd-button rd-quiet')}`,'manual-book','Add a book'));
add('manual-confirm','05 책 추가와 스캔','직접 등록 · 저장',()=>{const shelfNames=[...new Set(libraryEntries.map(entry=>entry.shelf))];if(state.newShelf&&!shelfNames.includes(state.newShelf))shelfNames.push(state.newShelf);return page('Save your book',`<div class="rd-book"><div class="rd-cover" style="--cover:#416071"><b>${e(state.manualTitle||'My favorite stories')}</b><small>${e(state.manualAuthor||'Alex Morgan')}</small></div><div><h2>${e(state.manualTitle||'My favorite stories')}</h2><p class="rd-sub">${e(state.manualAuthor||'Alex Morgan')}</p><p class="rd-meta">${state.manualPhoto?'Optional cover photo selected':'Generated title cover'}</p></div></div><label class="rd-field">Shelf · Required<select id="rd-destination">${state.onboarding&&!state.newShelf?'<option value="">Create your first shelf</option>':shelfNames.map(name=>`<option ${state.shelf===name?'selected':''}>${e(name)}</option>`).join('')}</select></label>${go('create-shelf','Create a new shelf','rd-inline','plus')}${toggle('owned','I own this book',state.owned)}${statusChoices()}<div id="rd-form-error" class="rd-error" role="alert"></div>${act('add-manual','Add book')}`,{back:'manual-book'});});
add('manual-possible-duplicate','05 책 추가와 스캔','ISBN 없는 책 · 중복 가능성 검토',()=>{const possible=libraryEntries.find(entry=>entry.book===state.manualPossibleIndex)||libraryEntries[0];return page('Review possible duplicate',`${banner('No ISBN was entered. These titles may refer to the same book, but nothing has been merged or discarded.','warn','copy-check')}<h3>Your manual entry</h3><div class="rd-card"><strong>${e(state.manualTitle)}</strong><p class="rd-sub">${e(state.manualAuthor)}</p><p class="rd-meta">Will receive a unique entry ID · No ISBN</p></div><h3>Possible existing entry</h3>${booksummary(possible.book)}<p class="rd-meta">Unresolved: confirm these are separate entries now, or review the details. A later ISBN match must also require explicit resolution.</p>${act('confirm-manual-separate','Add as a separate entry')}${go('book','View existing entry','rd-button rd-secondary','book-open',`data-book="${possible.book}"`)}${go('manual-book','Review manual details','rd-button rd-quiet')}`,{back:'manual-confirm'});});
add('scan-saved','05 책 추가와 스캔','일괄 스캔 · 저장 완료',()=>`${camera(false)}<div class="rd-camerafoot">${banner(`Book added to ${e(state.shelf)}. One grouped shelf update will be created after the batch, if automatic activity is on.`,'success','check')}<p style="text-align:center;margin:18px 0">Ready for the next book</p>${go('scanner','Scan next book','rd-button','scan-line')}${go('shelf','Done scanning','rd-button')}</div>`);
add('photo-denied','05 책 추가와 스캔','사진 접근 거부',()=>{const destination=state.photoReturn==='edit-profile'?'edit-profile':state.photoReturn==='manual-book'?'manual-book':state.photoReturn==='setup'?'setup':'compose';return page('Photo access',`${empty('image-off','Your photos are unavailable','Allow photo access in phone settings, or continue without a photo.',act('device-settings','Open phone settings'))}${go(destination,'Continue without a photo','rd-button rd-secondary')}`,{back:destination});});

const pendingReaders=[
 {id:'priya',name:'Priya Shah',initials:'PS',activity:'Sent a request today',shelves:[],color:'#f7e6ef',ink:'#8c3d62'},

const publicReader={id:'camille',name:'Camille Reed',initials:'CR',activity:'Public reader',shelves:[['Field notes',18,'Public',7],['Quiet futures',11,'Public',6]],color:'#e8e5f6',ink:'#574a83'};
const allReaders=()=>[...readers,...pendingReaders,publicReader];
const activeReader=()=>allReaders().find(r=>r.id===state.selectedFriend)||readers[0];
const activeRequest=()=>pendingReaders.find(r=>r.id===state.selectedRequest)||pendingReaders[0];
const requestCandidate=()=>allReaders().find(r=>r.id===state.requestCandidate)||pendingReaders[3];
const friendAvatar=(r,large=false)=>`<span class="rd-avatar ${large?'large':''}" style="background:${r.color};color:${r.ink}">${r.initials}</span>`;
const friendrow=(who,desc,target='friend-profile',attr='data-friend')=>{const r=allReaders().find(x=>x.id===String(who).toLowerCase())||readers[0];return `<button type="button" class="rd-row" data-go="${target}" ${attr}="${r.id}">${friendAvatar(r)}<span><strong>${e(r.name)}</strong><small>${e(desc)}</small></span>${icon('chevron-right')}</button>`;};
const connectedReaders=()=>[...readers,...pendingReaders.filter(r=>state.acceptedExtraIds.includes(r.id))].filter(r=>!state.removedIds.includes(r.id)&&!state.blockedIds.includes(r.id));
add('friends','06 친구','친구 목록',()=>{const connected=connectedReaders();const matches=connected.filter(r=>r.name.toLowerCase().includes(state.friendQuery.toLowerCase()));return page('Friends',`${go('invite','Invite a friend','rd-button','user-plus')}<div class="rd-twocol">${go('requests',`Received · ${state.incomingRequestIds.length}`,'rd-button rd-secondary')}${go('sent-requests',`Sent · ${state.sentRequestIds.length}`,'rd-button rd-secondary')}</div>${search(state.friendQuery,'friends','Search friends by name')}<div class="rd-friend-summary"><h2 style="font-size:18px">Your friends · ${connected.length}</h2>${state.friendQuery?act('clear-friends','Clear search','rd-inline'):''}</div>${state.friendQuery?`<p class="rd-meta">${matches.length} ${matches.length===1?'match':'matches'} for “${e(state.friendQuery)}”</p>`:''}<div>${matches.length?matches.map(r=>friendrow(r.id,r.activity)).join(''):empty('search','No friends found','Try another name.',act('clear-friends','Show all friends','rd-button rd-secondary'))}</div>`,{tab:'friends'});});
add('friends-empty','06 친구','친구 없음',()=>page('Friends',`${empty('users-round','Build your reading circle','Connect with people whose reading life you’d like to follow.',go('invite','Invite a friend','rd-button','user-plus'))}${go('enter-code','Enter a friend’s code','rd-button rd-secondary')}`,{tab:'friends'}));
add('invite','06 친구','친구 초대 코드와 링크',()=>page('Invite a friend',`<div class="rd-card"><p class="rd-meta" style="text-align:center">Your invite code</p><div class="rd-code">A94-G91</div><p class="rd-sub" style="text-align:center">Friends can use this code to send you a request.</p></div><div class="rd-twocol">${act('copy','Copy code','rd-button rd-secondary','copy')}${act('share','Share link','rd-button','share-2')}</div>${banner('You’ll both get access to friends-only shelves after the request is accepted.')} ${go('enter-code','Enter a friend’s code instead','rd-button rd-quiet')}`,{back:'friends'}));
add('enter-code','06 친구','친구 코드 입력',()=>page('Connect with a reader',`${field('invite-code','Friend’s invite code','','ABC-123','text','Codes have 6 letters or numbers.')}<div id="rd-form-error" class="rd-error" role="alert"></div>${act('find-friend','Find friend')}${banner('Entering a code does not connect you automatically.')}`,{back:'friends'}));
add('invalid-code','06 친구','잘못된 친구 코드',()=>page('Connect with a reader',`${field('invite-code','Friend’s invite code','AAA-000','ABC-123')}${banner('We couldn’t find that code. Check it with your friend and try again.','error','circle-alert')}<div id="rd-form-error" class="rd-error" role="alert"></div>${act('find-friend','Try again')}`,{back:'enter-code'}));
add('request-preview','06 친구','친구 요청 전 확인',()=>{const candidate=requestCandidate();const alreadyFriend=connectedReaders().some(r=>r.id===candidate.id);const alreadySent=state.sentRequestIds.includes(candidate.id);return page('Send a request',`<div class="rd-empty">${friendAvatar(candidate,true)}<h2 style="margin-top:20px">${e(candidate.name)}</h2><p>${alreadyFriend?'You are already friends.':alreadySent?'Your request is awaiting a response.':`Send ${e(candidate.name.split(' ')[0])} a friend request to connect your reading circles.`}</p>${alreadyFriend?go('friend-profile','View friend','rd-button','users-round',`data-friend="${candidate.id}"`):alreadySent?go('sent-requests','View sent requests'):act('send-request','Send friend request','rd-button','user-plus')}</div>${banner(`${e(candidate.name.split(' ')[0])} must accept before either of you can browse friends-only shelves.`)}`,{back:state.requestReturn||'friends'});});
add('request-sent','06 친구','친구 요청 발송',()=>{const candidate=requestCandidate();return page('Request sent',`${empty('send',`Over to ${e(candidate.name.split(' ')[0])}`,`You’ll be notified when ${e(candidate.name.split(' ')[0])} accepts. Friends-only shelves remain private until then.`,go('friends','Back to Friends'))}${go('sent-requests','View sent requests','rd-button rd-secondary')}`,{back:'friends'});});
add('requests','06 친구','받은 친구 요청',()=>page('Friend requests',`${state.incomingRequestIds.length?state.incomingRequestIds.map((id,index)=>friendrow(id,index===0?'Sent you a request · Today':'Sent you a request · Yesterday','request-detail','data-request')).join(''):empty('user-check','No pending requests','New friend requests will appear here.')}`,{back:'friends'}));
add('request-detail','06 친구','친구 요청 수락·거절',()=>{const person=activeRequest();return page('Friend request',`<div class="rd-empty">${friendAvatar(person,true)}<h2 style="margin-top:20px">${e(person.name)}</h2><p>${e(person.name.split(' ')[0])} wants to join your reading circle.</p></div>${banner('Accepting shares your Friends shelves and Circle posts with each other. Private shelves stay private.')} ${act('accept-request','Accept request')}${act('decline-request','Decline','rd-button rd-secondary')}`,{back:'requests'});});
add('sent-requests','06 친구','보낸 친구 요청',()=>page('Sent requests',`${state.sentRequestIds.length?state.sentRequestIds.map(id=>{const person=allReaders().find(r=>r.id===id);return `<div class="rd-card"><div class="rd-person">${friendAvatar(person)}<div><strong>${e(person.name)}</strong><div class="rd-meta">Awaiting response</div></div></div><button type="button" class="rd-button rd-quiet" data-act="cancel-request" data-request-candidate="${person.id}">Cancel request</button></div>`;}).join(''):empty('send','No sent requests','Requests you send will appear here.')}<p class="rd-meta">Friends-only access begins only after acceptance.</p>`,{back:'friends'}));
add('friend-profile','06 친구','친구 프로필',()=>{const r=activeReader();return page('Reader profile',`<div style="text-align:center">${friendAvatar(r,true)}<h2 style="margin-top:14px">${e(r.name)}</h2><p class="rd-sub">Your friend · ${r.shelves.length} shared ${r.shelves.length===1?'shelf':'shelves'}</p></div>${badge('Connected','green','check')}<p class="rd-sub">${e(r.activity)}</p>${section(r.name.split(' ')[0]+'’s shelves')}${r.shelves.length?r.shelves.map(s=>shelfCard(...s,'friend-shelf')).join(''):empty('library-big','No shelves shared yet','Your friend’s shared shelves will appear here.')}`,{back:'friends',right:ib('profile-menu','ellipsis','Connection options')});});
add('profile-menu','06 친구','연결 관리 메뉴',()=>sheet('Connection options',`${row('remove-friend','Remove friend','','user-minus')}${row('block-friend','Block this reader','','ban')}${row('report','Report profile','','flag','data-report-context="friend-profile"')}`,'friend-profile',e(activeReader().name)));
