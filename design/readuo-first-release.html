const groupPicker=root.querySelector('#rd-group');
const screenPicker=root.querySelector('#rd-screen');
const groups=[...new Set(screens.map(s=>s.group))];
groupPicker.innerHTML=groups.map(g=>`<option>${g}</option>`).join('');
root.querySelector('#rd-catalog').innerHTML=groups.map(g=>`<details><summary>${g} · ${screens.filter(s=>s.group===g).length}</summary><div class="rd-catalog-items">${screens.filter(s=>s.group===g).map(s=>go(s.id,s.title)).join('')}</div></details>`).join('');
let toastTimer=null;
function toast(message){const t=root.querySelector('#rd-toast');t.textContent=message;t.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>{t.hidden=true;},3500);}
function value(id){return root.querySelector('#rd-'+id)?.value?.trim()||'';}
function chosen(name,fallback=''){return root.querySelector('input[name="'+name+'"]:checked')?.value||fallback;}
function error(text){const node=root.querySelector('#rd-form-error');if(node)node.textContent=text;else toast(text);}
function captureDraft(){const input=root.querySelector('#rd-post-text');if(input)state.draft=input.value;}
function syncSelectedEntry(){const entry=selectedEntry();if(!entry)return;entry.shelf=state.shelf;entry.status=state.status;entry.owned=state.owned;}
function addSelectedBook(){if(selectedEntry())return false;const book=selectedBookIndex();libraryEntries.push({entryId:'entry-'+nextEntryNumber++,book,normalizedIsbn:bookIdentity(book),shelf:state.shelf,status:state.status,owned:state.owned});return true;}
function manualMatchKey(title,author){return `${title}|${author}`.toLowerCase().replace(/[^a-z0-9]/g,'');}
function createManualEntry(){const normalizedIsbn=normalizeISBN(state.manualIsbn);const book=books.push([state.manualTitle,state.manualAuthor,'#416071',normalizedIsbn])-1;state.bookIndex=book;state.visibility=shelfVisibility(state.shelf);state.auto=shelfAuto(state.shelf);libraryEntries.push({entryId:'entry-'+nextEntryNumber++,book,normalizedIsbn,shelf:state.shelf,status:state.status,owned:state.owned});state.manualPossibleIndex=null;state.onboarding=false;navigate('book');toast(normalizedIsbn?'ISBN-specific book added':'Separate manual entry added');}
function render(){
 const index=screens.findIndex(s=>s.id===state.page);const screen=screens[index]||screens[0];
 view.innerHTML=screen.render();
 groupPicker.value=screen.group;
 screenPicker.innerHTML=screens.filter(s=>s.group===screen.group).map(s=>`<option value="${s.id}">${s.title}</option>`).join('');screenPicker.value=screen.id;
 root.querySelector('#rd-position').textContent=`${index+1} / ${screens.length}`;
 root.querySelector('#rd-screen-name').textContent=screen.title;
 root.querySelector('#rd-toast').hidden=true;
 if(globalThis.lucide)globalThis.lucide.createIcons({attrs:{width:18,height:18}});
}
function navigate(id){
 if(!screens.some(s=>s.id===id))return;
 const from=state.page;
 captureDraft();
 if(id==='compose'&&from==='circle'){state.draft='';state.photo=false;state.attachedBook=null;}
 if(id==='edit-post'&&state.ownPost){state.draft=state.ownPost.text;state.photo=state.ownPost.photo;state.attachedBook=state.ownPost.book;}
 if(id==='create-shelf')state.shelfReturn=state.page;
 if(id==='profile-photo'||id==='book-photo')state.photoReturn=state.page;
 if((id==='terms'||id==='privacy')&&state.page!=='terms'&&state.page!=='privacy')state.infoReturn=state.page==='profile'?'profile':'login';
 if(id==='request-preview'&&state.page!=='request-preview')state.requestReturn=state.page;
 if(state.page==='profile-photo'&&id==='setup'&&state.photoReturn==='edit-profile')id='edit-profile';
 if(id==='scanner'&&state.page==='library'){state.shelf=state.shelf||'Living room';state.visibility=shelfVisibility(state.shelf);state.auto=shelfAuto(state.shelf);}
 state.history.push(state.page);state.page=id;render();
}
function selectedDestination(){return value('destination')||chosen('destination',state.shelf);}
function validateISBN(raw){const s=raw.replace(/[-\s]/g,'').toUpperCase();if(/^\d{13}$/.test(s)){return [...s].reduce((sum,n,i)=>sum+Number(n)*(i%2?3:1),0)%10===0;}if(/^\d{9}[\dX]$/.test(s)){return [...s].reduce((sum,n,i)=>sum+(n==='X'?10:Number(n))*(10-i),0)%11===0;}return false;}
function normalizeISBN(raw){const isbn=String(raw||'').replace(/[-\s]/g,'').toUpperCase();if(!validateISBN(isbn))return null;if(isbn.length===13)return isbn;const base='978'+isbn.slice(0,9);const sum=[...base].reduce((total,digit,index)=>total+Number(digit)*(index%2?3:1),0);return base+((10-sum%10)%10);}
function performSearch(target,form){const query=form?.querySelector('input')?.value.trim()||'';if(target==='friends'){state.friendQuery=query;navigate('friends');return;}if(target==='attach-book'){state.attachQuery=query;navigate('attach-book');return;}if(target==='offline-library'){state.offlineQuery=query;navigate('offline-library');return;}state.query=query;if(!query){toast('Enter a title, author, or ISBN');return;}const catalogueMatch=books.some(book=>book.join(' ').toLowerCase().includes(query.toLowerCase()));if(target==='search-results'&&!libraryEntries.some(entry=>books[entry.book].join(' ').toLowerCase().includes(query.toLowerCase())))navigate('search-empty');else if(target==='explore-results'&&!catalogueMatch)navigate('explore-no-results');else if(target==='catalogue-results'&&!catalogueMatch)navigate('catalogue-no-results');else navigate(target);}
const actions={
 'save-profile':()=>{if(!value('name'))return error('Please enter a display name.');state.name=value('name');state.onboarding=true;navigate('first-book');},
 'edit-profile':()=>{if(!value('name'))return error('Please enter a display name.');state.name=value('name');navigate('profile');toast('Profile updated');},
 like:()=>{state.liked=!state.liked;render();},
 refresh:()=>toast('You’re up to date'),
 'clear-filter':()=>{state.filter='All';navigate('library-books');},
 'select-profile-photo':()=>{state.profilePhoto=true;navigate(state.photoReturn==='edit-profile'?'edit-profile':'setup');toast('Sample profile photo selected');},
 'add-photo':()=>{captureDraft();state.photo=true;render();},
 'remove-photo':()=>{captureDraft();state.photo=false;render();},
 attach:()=>{state.attachedBook=selectedBookIndex();navigate('compose');toast('Book attached');},
 'detach-book':()=>{state.attachedBook=null;captureDraft();render();},
 publish:()=>{const text=value('post-text');if(!text&&!state.photo)return error('Add text or a photo before posting.');state.draft=text;state.ownPost={text,photo:state.photo,book:state.attachedBook};state.photo=false;state.attachedBook=null;navigate('circle');toast('Post shared with friends');},
 'save-edit':()=>{const text=value('post-text');if(!text&&!state.photo)return error('Your post needs text or a photo.');state.draft=text;state.ownPost={text,photo:state.photo,book:state.attachedBook};navigate('circle');toast('Post updated');},
 'delete-post':()=>{state.ownPost=null;state.draft='';state.photo=false;state.attachedBook=null;navigate('circle');toast('Post removed');},
 'publish-review':()=>{const text=value('review-text');if(!text)return error('Write a review before publishing.');state.reviewDraft=text;state.reviewPublished=true;navigate('book');toast('Review shared with friends');},
 comment:()=>{if(!value('comment'))return error('Write a comment first.');state.comments.push(value('comment'));render();toast('Comment added');},
 'save-comment':()=>{if(!value('edit-comment'))return error('Your comment cannot be empty.');state.ownComment=value('edit-comment');navigate('post');toast('Comment updated');},
 'delete-comment':()=>{state.ownComment='';navigate('post');toast('Comment removed');},
 report:()=>{state.reportReason=chosen('report',state.reportReason);navigate('report-sent');},
 sort:()=>{state.sort=chosen('sort','recent');navigate('library-books');toast('Sort updated');},
 'create-shelf':()=>{const name=value('shelf-name');if(!name)return error('Please name your shelf.');if(shelfMeta[name])return error('A shelf with that name already exists.');state.newShelf=name;state.shelf=name;state.visibility=chosen('visibility','Friends');state.auto=state.visibility!=='Private'&&(root.querySelector('[data-toggle="create-auto"]')?.checked??true);shelfMeta[name]={visibility:state.visibility,auto:state.auto};const target=['scan-found','save-shelf','manual-confirm','scanner','move-all'].includes(state.shelfReturn)?state.shelfReturn:'shelf-empty';navigate(target);toast('Shelf created');},
 'save-shelf':()=>{const newName=value('shelf-name');if(!newName)return error('Please name your shelf.');const oldName=state.shelf;const visibility=chosen('visibility',state.visibility);const auto=visibility!=='Private'&&(root.querySelector('[data-toggle="auto"]')?.checked??state.auto);state.pendingShelfSettings={oldName,newName,visibility,auto};if(visibility==='Private'&&state.visibility!=='Private'){navigate('private-confirm');return;}actions['apply-shelf-settings']();},
 'apply-shelf-settings':()=>{const pending=state.pendingShelfSettings||{oldName:state.shelf,newName:state.shelf,visibility:state.visibility,auto:state.auto};libraryEntries.filter(entry=>entry.shelf===pending.oldName).forEach(entry=>entry.shelf=pending.newName);if(pending.oldName!==pending.newName)delete shelfMeta[pending.oldName];shelfMeta[pending.newName]={visibility:pending.visibility,auto:pending.visibility==='Private'?false:pending.auto};state.shelf=pending.newName;state.visibility=pending.visibility;state.auto=shelfAuto(pending.newName);state.pendingShelfSettings=null;navigate('shelf');toast('Shelf settings saved');},
 'make-private':()=>{if(state.pendingShelfSettings){state.pendingShelfSettings.visibility='Private';state.pendingShelfSettings.auto=false;actions['apply-shelf-settings']();}else{shelfMeta[state.shelf]={visibility:'Private',auto:false};state.visibility='Private';state.auto=false;navigate('shelf');}toast('Shelf and inaccessible derived activity are now private');},
 'move-all':()=>{const source=state.shelf;const destination=selectedDestination();if(!destination||destination===source)return error('Choose a different destination shelf.');libraryEntries.filter(entry=>entry.shelf===source).forEach(entry=>entry.shelf=destination);delete shelfMeta[source];state.shelf=destination;state.visibility=shelfVisibility(destination);state.auto=shelfAuto(destination);navigate('library');toast('Books moved; original shelf deleted');},
 'delete-shelf':()=>{const source=state.shelf;if(selectedEntry()?.shelf===source){state.reviewPublished=false;state.reviewDraft='';}for(let index=libraryEntries.length-1;index>=0;index--)if(libraryEntries[index].shelf===source)libraryEntries.splice(index,1);delete shelfMeta[source];navigate('library');toast('Shelf, entries, and associated shared activity removed');},
 'save-status':()=>{state.status=chosen('reading',state.status);syncSelectedEntry();navigate('book');toast('Reading status updated');},
 'move-book':()=>{const destination=selectedDestination();const entry=selectedEntry();if(!entry||!destination)return error('Choose a destination shelf.');entry.shelf=destination;state.shelf=destination;state.visibility=shelfVisibility(destination);state.auto=shelfAuto(destination);navigate('book');toast('Book moved to one shelf');},
 'remove-book':()=>{const selected=selectedEntry();const index=libraryEntries.findIndex(entry=>entry.entryId===selected?.entryId);if(index>=0)libraryEntries.splice(index,1);state.reviewPublished=false;state.reviewDraft='';navigate('library');toast('Book and associated shared activity removed');},
 'save-book':()=>{const existing=selectedEntry();if(existing){navigate('book');toast('Existing entry kept unchanged');return;}state.shelf=selectedDestination();if(!state.shelf)return error('Choose a shelf.');state.owned=root.querySelector('[data-toggle="save-owned"]')?.checked||false;state.status='Want to read';addSelectedBook();navigate('book-saved');},
 flash:()=>toast('Flashlight toggled · preview only'),
 'device-settings':()=>toast('In the installed app, this opens phone settings'),
 'add-scan':()=>{if(state.onboarding&&!state.newShelf)return error('Create a shelf before adding your first book.');state.shelf=selectedDestination();if(!state.shelf)return error('Choose a shelf.');state.visibility=shelfVisibility(state.shelf);state.auto=shelfAuto(state.shelf);if(!addSelectedBook()){navigate('scan-duplicate');return;}state.onboarding=false;navigate('book');toast('Book added to '+state.shelf);},
 'add-batch':()=>{if(state.onboarding&&!state.newShelf)return error('Create a shelf before adding your first book.');state.shelf=selectedDestination();if(!state.shelf)return error('Choose a shelf.');state.visibility=shelfVisibility(state.shelf);state.auto=shelfAuto(state.shelf);if(!addSelectedBook()){navigate('scan-duplicate');return;}state.onboarding=false;navigate('scan-saved');},
 'lookup-isbn':()=>{const normalizedIsbn=normalizeISBN(value('isbn'));if(!normalizedIsbn)return error('Enter a valid 10- or 13-digit ISBN.');state.lookupIsbn=normalizedIsbn;const match=books.findIndex((book,index)=>bookIdentity(index)===normalizedIsbn);if(match<0){navigate('isbn-not-found');return;}state.bookIndex=match;navigate('scan-found');},
 'manual-next':()=>{if(!value('book-title')||!value('book-author'))return error('Please add a title and author.');if(value('book-isbn')&&!validateISBN(value('book-isbn')))return error('Check the ISBN, or leave it blank.');state.manualTitle=value('book-title');state.manualAuthor=value('book-author');state.manualIsbn=value('book-isbn');state.manualPublisher=value('book-publisher');state.manualYear=value('book-year');state.manualDescription=value('book-description');navigate('manual-confirm');},
 'select-cover-photo':()=>{state.manualPhoto=true;navigate('manual-book');toast('Sample cover selected');},
 'remove-cover-photo':()=>{state.manualPhoto=false;navigate('manual-book');},
 'add-manual':()=>{if(state.onboarding&&!state.newShelf)return error('Create a shelf before adding your first book.');state.shelf=selectedDestination();if(!state.shelf)return error('Choose a shelf.');const normalizedIsbn=normalizeISBN(state.manualIsbn);if(normalizedIsbn){const existing=libraryEntries.find(entry=>entry.normalizedIsbn===normalizedIsbn);if(existing){state.bookIndex=existing.book;navigate('scan-duplicate');return;}createManualEntry();return;}const possible=libraryEntries.find(entry=>manualMatchKey(books[entry.book][0],books[entry.book][1])===manualMatchKey(state.manualTitle,state.manualAuthor));if(possible){state.manualPossibleIndex=possible.book;navigate('manual-possible-duplicate');return;}createManualEntry();},
 'confirm-manual-separate':()=>createManualEntry(),
 copy:()=>toast('Invite code: A94-G91 · preview only'),
 share:()=>toast('In the installed app, this opens your phone’s share sheet'),
 'find-friend':()=>{const code=value('invite-code').replace(/[-\s]/g,'').toUpperCase();if(!/^[A-Z0-9]{6}$/.test(code))return error('Enter all 6 letters or numbers.');if(code==='AAA000')return navigate('invalid-code');state.requestCandidate='riley';navigate('request-preview');},
 'send-request':()=>{if(!state.sentRequestIds.includes(state.requestCandidate))state.sentRequestIds.push(state.requestCandidate);navigate('request-sent');},
 'accept-request':()=>{const id=state.selectedRequest;state.incomingRequestIds=state.incomingRequestIds.filter(requestId=>requestId!==id);if(!state.acceptedExtraIds.includes(id))state.acceptedExtraIds.push(id);state.selectedFriend=id;navigate('friend-profile');toast('Friend request accepted');},
 'decline-request':()=>{state.incomingRequestIds=state.incomingRequestIds.filter(id=>id!==state.selectedRequest);navigate('requests');toast('Request declined');},
 'cancel-request':()=>{state.sentRequestIds=state.sentRequestIds.filter(id=>id!==state.requestCandidate);navigate('sent-requests');toast('Request cancelled');},
 'clear-friends':()=>{state.friendQuery='';render();},
 'remove-friend':()=>{if(!state.removedIds.includes(state.selectedFriend))state.removedIds.push(state.selectedFriend);navigate('friends');toast('Connection and friends-only access removed');},
 block:()=>{if(!state.blockedIds.includes(state.selectedFriend))state.blockedIds.push(state.selectedFriend);if(!state.removedIds.includes(state.selectedFriend))state.removedIds.push(state.selectedFriend);state.incomingRequestIds=state.incomingRequestIds.filter(id=>id!==state.selectedFriend);state.sentRequestIds=state.sentRequestIds.filter(id=>id!==state.selectedFriend);navigate('friends');toast('Reader blocked');},
 unblock:()=>{state.blockedIds=state.blockedIds.filter(id=>id!==state.selectedFriend);navigate('blocked-users');toast('Reader unblocked; friendship not restored');},
 'delete-account-next':()=>{if(!root.querySelector('#rd-delete-check')?.checked)return error('Please confirm that you understand before continuing.');navigate('reauth');},
 support:()=>{if(!value('support-subject')||!value('support-message'))return error('Please add a subject and message.');navigate('support');toast('Support request preview complete');},
 connection:()=>{navigate('library');toast('Showing connected state');},
 'enable-push':()=>{navigate('circle');toast('Notification permission opens on your phone');},
 'dismiss-report':()=>{navigate('moderation');toast('Report dismissed · preview');},
 'resolve-report':()=>{navigate('moderation');toast('Reported content removed · preview');}
};
root.addEventListener('click',event=>{
 const button=event.target.closest('button');if(!button||!root.contains(button))return;
 if(button.dataset.friend)state.selectedFriend=button.dataset.friend;
 if(button.dataset.request)state.selectedRequest=button.dataset.request;
 if(button.dataset.requestCandidate)state.requestCandidate=button.dataset.requestCandidate;
 if(button.dataset.provider)state.authProvider=button.dataset.provider;
 if(button.dataset.reportContext)state.reportContext=button.dataset.reportContext;
 if(button.dataset.remoteShelf)state.remoteShelf=button.dataset.remoteShelf;
 if(button.dataset.book!==undefined)state.bookIndex=Number(button.dataset.book);
 if(button.dataset.searchSubmit){performSearch(button.dataset.searchSubmit,button.closest('form'));return;}
 if(button.dataset.review){const op=button.dataset.review;if(op==='catalog'){const c=root.querySelector('#rd-catalog');c.hidden=!c.hidden;return;}const index=screens.findIndex(s=>s.id===state.page);navigate(screens[(index+(op==='next'?1:-1)+screens.length)%screens.length].id);return;}
 if(button.dataset.filter){state.filter=button.dataset.filter;render();return;}
 if(button.dataset.status){state.status=button.dataset.status;render();return;}
 if(button.dataset.rating){const review=root.querySelector('#rd-review-text');if(review)state.reviewDraft=review.value;const n=Number(button.dataset.rating);state.rating=state.rating===n?0:n;render();return;}
 if(button.dataset.go){if(button.dataset.shelf&&!button.dataset.remoteShelf){state.shelf=button.dataset.shelf;state.visibility=shelfVisibility(state.shelf);state.auto=shelfAuto(state.shelf);}navigate(button.dataset.go);return;}
 if(button.dataset.act&&actions[button.dataset.act])actions[button.dataset.act]();
});
root.addEventListener('change',event=>{
 const el=event.target;
 if(el===groupPicker){navigate(screens.find(s=>s.group===el.value).id);return;}
 if(el===screenPicker){navigate(el.value);return;}
 const key=el.dataset?.toggle;
 if(key){if(key==='owned'){state.owned=el.checked;if(state.page==='book'){syncSelectedEntry();render();toast(el.checked?'Ownership added':'Ownership removed from discovery');}}else if(key==='auto')state.auto=el.checked;else if(key.startsWith('notif-'))state.notifications[key.slice(6)]=el.checked;}
 if(el.name==='visibility'){
   const t=root.querySelector('[data-toggle="auto"]')||root.querySelector('[data-toggle="create-auto"]');
   if(t){t.disabled=el.value==='Private';if(t.disabled)t.checked=false;}
 }
});
root.addEventListener('input',event=>{const target=event.target;if(target.id==='rd-invite-code'){const cleaned=target.value.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,6);target.value=cleaned.length>3?cleaned.slice(0,3)+'-'+cleaned.slice(3):cleaned;}const manualMap={'rd-book-title':'manualTitle','rd-book-author':'manualAuthor','rd-book-isbn':'manualIsbn','rd-book-publisher':'manualPublisher','rd-book-year':'manualYear','rd-book-description':'manualDescription'};if(manualMap[target.id])state[manualMap[target.id]]=target.value;if(target.id==='rd-review-text')state.reviewDraft=target.value;if(target.id==='rd-post-text')state.draft=target.value;});
root.addEventListener('submit',event=>{const target=event.target.dataset?.search;if(!target)return;event.preventDefault();performSearch(target,event.target);});
function style(){root.style.setProperty('--rd-accent',design.accent);root.style.setProperty('--rd-radius',design.radius+'px');}
style();render();
if(globalThis.Tweak){const tweak=new Tweak({container:root.querySelector('#rd-phone'),onChange:style});tweak.addColorPicker(design,'accent',{label:'Modern accent',reference:'--rd-accent'});tweak.addSlider(design,'radius',{label:'Card corners',min:8,max:24,unit:'px',reference:'--rd-radius'});}
root.__readuo={screens,state,libraryEntries,shelfMeta,render,navigate,actions,validateISBN,normalizeISBN};
})();
</script>
